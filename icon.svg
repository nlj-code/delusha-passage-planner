<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="seaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d2238"/>
      <stop offset="100%" stop-color="#153454"/>
    </linearGradient>
    <filter id="routeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Rounded Squircle Sea Background -->
  <rect width="512" height="512" rx="112" fill="url(#seaGrad)"/>

  <!-- Subtle Nautical Graticule Grid -->
  <g stroke="#2a4d70" stroke-width="2" opacity="0.55">
    <line x1="128" y1="0" x2="128" y2="512"/>
    <line x1="256" y1="0" x2="256" y2="512"/>
    <line x1="384" y1="0" x2="384" y2="512"/>
    <line x1="0" y1="128" x2="512" y2="128"/>
    <line x1="0" y1="256" x2="512" y2="256"/>
    <line x1="0" y1="384" x2="512" y2="384"/>
  </g>

  <!-- Stylized Mediterranean Islands / Coastlines (Sand fill + bronze coast) -->
  <path d="M -10 110 Q 95 120 135 190 Q 165 245 105 290 Q 45 330 -10 310 Z" fill="#d9ccb2" stroke="#8b7759" stroke-width="4"/>
  <path d="M 325 215 Q 375 185 435 225 Q 465 265 415 320 Q 355 355 315 305 Q 285 255 325 215 Z" fill="#d9ccb2" stroke="#8b7759" stroke-width="4"/>
  <path d="M 195 70 Q 245 55 270 95 Q 265 135 215 130 Q 175 115 195 70 Z" fill="#d9ccb2" stroke="#8b7759" stroke-width="4"/>

  <!-- Outer Compass Ring -->
  <circle cx="256" cy="256" r="222" fill="none" stroke="#3b638c" stroke-width="3" stroke-dasharray="8 8" opacity="0.7"/>

  <!-- Planned Water Route Casing & Dashed Track -->
  <path d="M 102 406 L 196 322 L 242 192 L 388 112" fill="none" stroke="#081524" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" opacity="0.65"/>
  <path d="M 102 406 L 196 322 L 242 192 L 388 112" fill="none" stroke="#fb923c" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" filter="url(#routeGlow)"/>
  <path d="M 102 406 L 196 322 L 242 192 L 388 112" fill="none" stroke="#fff7ed" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="12 14" opacity="0.85"/>

  <!-- Start Port Marker (Bottom Left) -->
  <circle cx="102" cy="406" r="22" fill="#ea580c" stroke="#ffffff" stroke-width="6"/>
  <circle cx="102" cy="406" r="7" fill="#ffffff"/>

  <!-- Intermediate Teal Waypoints -->
  <circle cx="196" cy="322" r="15" fill="#14b8a6" stroke="#ffffff" stroke-width="5"/>
  <circle cx="242" cy="192" r="15" fill="#14b8a6" stroke="#ffffff" stroke-width="5"/>

  <!-- Destination Port Marker (Top Right) -->
  <circle cx="388" cy="112" r="25" fill="#ea580c" stroke="#ffffff" stroke-width="6"/>
  <circle cx="388" cy="112" r="9" fill="#ffffff"/>
</svg>